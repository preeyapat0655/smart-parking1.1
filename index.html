}

<body>
<div class="light1"></div>
<div class="light2"></div>
<div class="light3"></div>
<div class="car1">🚗</div>
<div class="car2">🚙</div>
<div class="cloud1">☁️</div>
<div class="cloud2">☁️</div>
<div class="tree">🌳</div>
<div class="header">

<h1>🚗 SMART PARKING SYSTEM</h1>

<p>
Realtime Parking Reservation
</p>

</div><div class="summary">

    <div class="card-info">
        <h2 id="freeCount">0</h2>
        <p>🟢 ช่องว่าง</p>
    </div>

    <div class="card-info">
        <h2 id="reservedCount">0</h2>
        <p>🟡 จอง</p>
    </div>

    <div class="card-info">
        <h2 id="occupiedCount">0</h2>
        <p>🔴 จอด</p>
    </div>

</div>
<div class="parking">
    <div id="A1" class="slot"></div>
    <div id="A2" class="slot"></div>
    <div id="A3" class="slot"></div>
    <div id="A4" class="slot"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getDatabase,
    ref,
    onValue,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "oooooo-57092.firebaseapp.com",
  databaseURL: "https://oooooo-57092-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "oooooo-57092"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// user id ประจำเครื่อง
const myId =
localStorage.getItem("userId")
||
Math.random().toString(36).substring(2);

localStorage.setItem("userId",myId);

// เก็บข้อมูลทุกช่อง
let allParkingData = {};

onValue(ref(db,"Parking"),(snap)=>{

    allParkingData = snap.val() || {};

    let free = 0;
    let reserved = 0;
    let occupied = 0;

    // ช่องทั้งหมด
    const slots = ["A1","A2","A3","A4"];

    slots.forEach(slot=>{

        const item = allParkingData[slot];

        if(!item || item.status==="empty"){
            free++;
        }
        else if(item.status==="reserved"){
            reserved++;
        }
        else if(item.status==="occupied"){
            occupied++;
        }

    });

    document.getElementById("freeCount").textContent = free;
    document.getElementById("reservedCount").textContent = reserved;
    document.getElementById("occupiedCount").textContent = occupied;

});
// จอง / ยกเลิก
function toggleParking(slot){

    const slotRef = ref(db,"Parking/"+slot);

    runTransaction(slotRef,(data)=>{

        if(!data){
            return {
                status:"reserved",
                owner:myId,
                startTime:Date.now()
            };
        }

        // รถจอดแล้ว
        if(data.status === "occupied"){
            return data;
        }

        // จองแล้ว
        if(data.status === "reserved"){

            // เจ้าของยกเลิกได้
            if(data.owner === myId){
                return {
                    status:"empty",
                    owner:"",
                    startTime:0
                };
            }

            return data;
        }

        // ช่องว่าง
        if(data.status === "empty"){

            // เช็คว่าจองช่องอื่นอยู่ไหม
            for(const key in allParkingData){

                const item = allParkingData[key];

                if(
                    item &&
                    item.status === "reserved" &&
                    item.owner === myId
                ){
                    alert("อ้ะอาาลูกจองได้แค่ที่จอดเดียวนะคะ!!");
                    return data;
                }
            }

            return {
                status:"reserved",
                owner:myId,
                startTime:Date.now()
            };
        }

        return data;
    });

}

window.toggleParking = toggleParking;

// realtime
["A1","A2","A3","A4"].forEach(slot=>{

    onValue(ref(db,"Parking/"+slot),(snap)=>{

        const data = snap.val();
        const div = document.getElementById(slot);

        if(!data){
            div.className="slot empty";
            div.innerHTML=`
                <div>${slot}</div>
                <div>🟢 ว่าง</div>
            `;
            div.onclick=()=>toggleParking(slot);
            return;
        }

        const isOwner =
        data.owner === myId;

        // ไม่ว่าง
        if(data.status==="occupied"){

            div.className="slot occupied";

            div.innerHTML=`
                <div>${slot}</div>
                <div>🔴 ไม่ว่าง</div>
            `;

            div.onclick=null;
        }

        // จองแล้ว
        else if(data.status==="reserved"){

            div.className="slot reserved";

            div.innerHTML=`
                <div>${slot}</div>
                <div>🟡 จองแล้ว</div>
                <div class="small">
                    ${
                    isOwner
                    ? "👤 ของคุณ (กดยกเลิกได้)"
                    : "🔒 คนอื่นจองอยู่"
                    }
                </div>
            `;

            div.onclick =
            isOwner
            ? ()=>toggleParking(slot)
            : null;
        }

        // ว่าง
        else{

            div.className="slot empty";

            div.innerHTML=`
                <div>${slot}</div>
                <div>🟢 ว่าง</div>
            `;

            div.onclick=
            ()=>toggleParking(slot);
        }

    });

});

</script>
